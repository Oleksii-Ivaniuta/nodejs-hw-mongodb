tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            description: "Contact person's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact personal phone number'
            type: string
            example: '+380671002345'
          email:
            description: 'Contact personal email'
            type: string
            format: email
            example: 'mail@domain.com'
          isFafourite:
            description: 'Mark contact as favourite or not'
            type: boolean
            example: true
          contactType:
            description: "Define contact's type"
            type: string
            enum: ['home', 'work', 'personal']
            example: 'work'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    $ref: '../../components/responses/201.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
