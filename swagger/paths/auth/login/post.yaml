tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authenticate user with email and password. Returns accessToken and sets refresh/session cookies.'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            format: email
            example: 'jd@domain.com'
          password:
            type: string
            format: password
            example: 'qwerty436346'
responses:
  '200':
    description: Successfully logged in
    headers:
      Set-Cookie:
        description: >
          Server sets HTTP-only cookies for session and refresh token.
          Two cookies are sent (shown as examples):
          - sessionId
          - refreshToken
        schema:
          type: string
        examples:
          sessionId:
            value: 'sessionId=j%3A%2268b1d6531cc0bc6edf42f2b8%22; HttpOnly; Secure; Path=/; SameSite=Strict'
          refreshToken:
            value: 'refreshToken=cROTUt340G6OUx1KsRX%2B3xm6px2XyjhqiPsxwb7J; HttpOnly; Secure; Path=/auth; SameSite=Strict'
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in'
            data:
              type: object
              required: [accessToken]
              properties:
                accessToken:
                  type: string
                  example: '5+daMSC/e7+1M4W03fVJ98I/+hr4PBP3ngN7MeHa'
  '401':
    $ref: '../../../components/responses/401.yaml'
