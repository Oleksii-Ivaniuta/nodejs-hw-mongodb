tags:
  - Auth
summary: Refresh session
operationId: refreshTokens
description: >
  Refresh user session by issuing a new access token and updating cookies
  (`sessionId` and `refreshToken`).  
  Requires valid refreshToken and sessionId cookies.
parameters:
  - in: cookie
    name: sessionId
    required: true
    schema:
      type: string
      example: 'j%3A%2268b1d6531cc0bc6edf42f2b8%22'
    description: 'Session cookie'
  - in: cookie
    name: refreshToken
    required: true
    schema:
      type: string
      example: 'cROTUt340G6OUx1KsRX%2B3xm6px2XyjhqiPsxwb7J'
    description: 'Refresh token cookie'
responses:
  '200':
    description: Successfully refreshed tokens
    headers:
      Set-Cookie:
        description: >
          Server sets new `sessionId` and `refreshToken` cookies.  
          Example shows cookies updated.
        schema:
          type: string
        examples:
          newSession:
            value: 'sessionId=j%3A%2268b1e9991cc0bc6edf42f2c1%22; HttpOnly; Secure; Path=/; SameSite=Strict'
          newRefresh:
            value: 'refreshToken=n3wRTokEn12345; HttpOnly; Secure; Path=/auth; SameSite=Strict'
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed tokens'
            data:
              type: object
              required: [accessToken]
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newAccessToken'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          required: [status, message]
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Invalid or expired refresh token'
