tags:
  - Auth
summary: 'Reset password'
operationId: 'resetPassword'
description: 'Reset user password using the JWT token received in email. Old session will be invalidated and password updated.'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: 'JWT token received in email link'
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.resetTokenExample'
          password:
            type: string
            description: 'New password for the account'
            example: 'N3wS3cur3P@ss'
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password successfully reset'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Password updated and previous session deleted'
  '401':
    description: Invalid or expired reset token
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Reset token expired or invalid'
